
<h2 class="sr-only">マイク入力を逆位相で再生するノイズキャンセラー</h2>

<div style="padding: 1.5rem 0; font-family: var(--font-mono);">

  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
    <div>
      <div style="font-size: 13px; color: var(--color-text-secondary); letter-spacing: 0.08em; text-transform: uppercase;">Active Noise Canceller</div>
      <div style="font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px;">Phase Inversion · Web Audio API</div>
    </div>
    <div id="status-badge" style="font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); background: var(--color-background-secondary);">● STANDBY</div>
  </div>

  <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); padding: 1rem; margin-bottom: 1rem;">
    <div style="font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 8px; letter-spacing: 0.06em;">INPUT WAVEFORM</div>
    <canvas id="cvs-in" width="600" height="80" style="width: 100%; height: 80px; display: block;"></canvas>
  </div>

  <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); padding: 1rem; margin-bottom: 1rem;">
    <div style="font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 8px; letter-spacing: 0.06em;">OUTPUT WAVEFORM (inverted ×−1)</div>
    <canvas id="cvs-out" width="600" height="80" style="width: 100%; height: 80px; display: block;"></canvas>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
      <div style="font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px;">GAIN</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="range" id="gain-slider" min="0" max="2" step="0.01" value="1" style="flex:1;">
        <span id="gain-val" style="font-size: 13px; min-width: 32px;">1.00</span>
      </div>
    </div>
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px;">
      <div style="font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 4px;">LATENCY OFFSET (ms)</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="range" id="delay-slider" min="0" max="100" step="1" value="0" style="flex:1;">
        <span id="delay-val" style="font-size: 13px; min-width: 32px;">0ms</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem;">
    <button id="btn-start" onclick="startANC()" style="padding: 10px; font-family: var(--font-mono); font-size: 13px; cursor: pointer;">▶ START ANC</button>
    <button id="btn-stop" onclick="stopANC()" style="padding: 10px; font-family: var(--font-mono); font-size: 13px; cursor: pointer;" disabled>■ STOP</button>
  </div>

  <div style="background: var(--color-background-info); border: 0.5px solid var(--color-border-info); border-radius: var(--border-radius-md); padding: 10px 12px; font-size: 12px; color: var(--color-text-info); line-height: 1.6;">
    ⚠ <strong>必ずイヤホン/ヘッドフォンを使用してください。</strong> スピーカーで使うとマイクがループしてハウリングします。
  </div>
</div>

<script>
let audioCtx, sourceNode, invertNode, delayNode, analyzer, stream;
let rafId;
let currentGain = 1.0;

const btnStart = document.getElementById('btn-start');
const btnStop  = document.getElementById('btn-stop');
const badge    = document.getElementById('status-badge');
const gainSlider  = document.getElementById('gain-slider');
const delaySlider = document.getElementById('delay-slider');
const gainVal  = document.getElementById('gain-val');
const delayVal = document.getElementById('delay-val');
const cvsIn  = document.getElementById('cvs-in');
const cvsOut = document.getElementById('cvs-out');

gainSlider.oninput = () => {
  currentGain = parseFloat(gainSlider.value);
  gainVal.textContent = currentGain.toFixed(2);
  if (invertNode) invertNode.gain.value = -currentGain;
};
delaySlider.oninput = () => {
  const ms = parseInt(delaySlider.value);
  delayVal.textContent = ms + 'ms';
  if (delayNode) delayNode.delayTime.value = ms / 1000;
};

async function startANC() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new AudioContext();
    sourceNode = audioCtx.createMediaStreamSource(stream);

    analyzer = audioCtx.createAnalyser();
    analyzer.fftSize = 1024;

    invertNode = audioCtx.createGain();
    invertNode.gain.value = -currentGain;

    delayNode = audioCtx.createDelay(0.2);
    delayNode.delayTime.value = parseInt(delaySlider.value) / 1000;

    sourceNode.connect(analyzer);
    sourceNode.connect(invertNode);
    invertNode.connect(delayNode);
    delayNode.connect(audioCtx.destination);

    badge.textContent = '● ACTIVE';
    badge.style.color = 'var(--color-text-success)';
    badge.style.borderColor = 'var(--color-border-success)';
    badge.style.background = 'var(--color-background-success)';
    btnStart.disabled = true;
    btnStop.disabled = false;

    draw();
  } catch(e) {
    badge.textContent = '● ERROR: ' + e.message;
    badge.style.color = 'var(--color-text-danger)';
  }
}

function stopANC() {
  if (rafId) cancelAnimationFrame(rafId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  audioCtx = sourceNode = invertNode = delayNode = analyzer = stream = null;
  badge.textContent = '● STANDBY';
  badge.style.color = 'var(--color-text-secondary)';
  badge.style.borderColor = 'var(--color-border-secondary)';
  badge.style.background = 'var(--color-background-secondary)';
  btnStart.disabled = false;
  btnStop.disabled = true;
  drawBaseline(cvsIn);
  drawBaseline(cvsOut);
}

function drawBaseline(c) {
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(136,135,128,0.2)';
  g.lineWidth = 0.5;
  g.beginPath(); g.moveTo(0, c.height / 2); g.lineTo(c.width, c.height / 2); g.stroke();
}

function drawWave(canvas, buf, scale, color) {
  const g = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = 'rgba(136,135,128,0.15)';
  g.lineWidth = 0.5;
  g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();

  g.strokeStyle = color;
  g.lineWidth = 1.5;
  g.beginPath();
  for (let i = 0; i < buf.length; i++) {
    const x = (i / buf.length) * W;
    const y = H / 2 - buf[i] * scale * H * 0.42;
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.stroke();
}

function draw() {
  if (!analyzer) return;
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const colorIn  = isDark ? '#5DCAA5' : '#0F6E56';
  const colorOut = isDark ? '#AFA9EC' : '#3C3489';

  const buf = new Float32Array(analyzer.fftSize);
  analyzer.getFloatTimeDomainData(buf);

  drawWave(cvsIn,  buf,  1,            colorIn);
  drawWave(cvsOut, buf, -currentGain,  colorOut);

  rafId = requestAnimationFrame(draw);
}

drawBaseline(cvsIn);
drawBaseline(cvsOut);
</script>
